name: Validate Grafana Dashboards

on:
  pull_request:
    branches:
      - main
    paths:
      - "dashboards/**/*.json"

jobs:
  validate-dashboards:
    name: Validate Dashboard JSON
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v6

      # Validate dashboards
      - name: Validate Grafana dashboards
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Grafana Dashboard Validation"
          echo "========================================"

          # Check if dashboards directory exists
          if [ ! -d "dashboards" ]; then
            echo "No dashboards directory found."
            echo "Dashboard files may have been deleted."
            exit 0
          fi

          files=$(find dashboards -type f -name "*.json")

          if [ -z "$files" ]; then
            echo "No dashboard JSON files found."
            echo "No JSON files require validation."
            exit 0
          fi

          for file in $files; do

            echo ""
            echo "----------------------------------------"
            echo "Validating: $file"
            echo "----------------------------------------"

            # ========================================
            # 1. JSON Syntax Validation
            # ========================================
            echo "1. Checking JSON syntax..."

            if ! jq empty "$file"; then
              echo "❌ Invalid JSON: $file"
              exit 1
            fi

            echo "✅ JSON syntax is valid"


          echo ""
          echo "========================================"
          echo "✅ All Grafana dashboard validations passed"
          echo "========================================"
