name: Unit tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "agent/**"
      - "evals/**"
      - "scripts/**"
      - "tests/**"
      - "!evals/candidates/**"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r agent/requirements.txt pytest httpx
      - run: python -m pytest -q tests
