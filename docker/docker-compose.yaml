services:

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped

    ports:
      - 9090:9090

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    networks:
      - monitoring


  grafana:
    image: grafana/grafana:13.2.0
    container_name: grafana
    restart: unless-stopped

    ports:
      - 3000:3000

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      - prometheus

    networks:
      - monitoring


  agent:
    build:
      context: ..
      dockerfile: agent/Dockerfile
    container_name: onboarding-agent
    restart: unless-stopped

    ports:
      - 8000:8000

    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      GEMINI_PRICE_INPUT_PER_1M_USD: ${GEMINI_PRICE_INPUT_PER_1M_USD:-0.0}
      GEMINI_PRICE_OUTPUT_PER_1M_USD: ${GEMINI_PRICE_OUTPUT_PER_1M_USD:-0.0}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_REPO: ${GITHUB_REPO}
      GITHUB_BASE_BRANCH: ${GITHUB_BASE_BRANCH:-main}
      GRAFANA_PROMETHEUS_DS_UID: ${GRAFANA_PROMETHEUS_DS_UID:-prometheus}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}

    depends_on:
      - prometheus

    networks:
      - monitoring


volumes:
  prometheus_data:
  grafana_data:


networks:
  monitoring:
    driver: bridge