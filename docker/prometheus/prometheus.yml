global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus

    static_configs:
      - targets:
          - prometheus:9090

  - job_name: onboarding-agent

    static_configs:
      - targets:
          - agent:8000

  - job_name: dummy-partner-metrics

    static_configs:
      - targets:
          - dummy-exporter:9091
